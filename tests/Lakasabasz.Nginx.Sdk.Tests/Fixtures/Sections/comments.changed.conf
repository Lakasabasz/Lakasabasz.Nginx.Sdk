# Rewritten header

server {
    listen 8090; # public port
    server_name comments.test;

    # static files
    location /static/ {
        root /var/www;
    }

    # about the API

    # API
    location /api {
        proxy_pass http://127.0.0.1:5000;
    }

    location = /health { return 204; } # probe
}
