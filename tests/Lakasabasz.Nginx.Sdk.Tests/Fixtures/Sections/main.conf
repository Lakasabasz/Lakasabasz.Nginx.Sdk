events {
}
http {
    ssl_certificate /tmp/nginx-sdk-tests/certs/fullchain.pem;
    ssl_certificate_key /tmp/nginx-sdk-tests/certs/privkey.pem;
    upstream backend {
        server 127.0.0.1:5000;
    }
    server {
        listen 8087 ssl;
        server_name api.example.test;
    }
    server {
        listen 8088;
        server_name plain.example.test;
    }
}
