events {
    worker_connections 512;
    multi_accept on;
    use epoll;
}
http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 1m5s;
    client_max_body_size 50m;
    server_tokens off;
    default_type application/octet-stream;
    gzip on;
    root /var/www/html;
    index index.html index.htm;
    include /etc/nginx/snippets/proxy-headers.conf;
    add_header X-Frame-Options deny always;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 2m;
    proxy_send_timeout 30s;
    proxy_http_version 1.1;
    proxy_buffering off;
    types {
        text/html html htm;
    }
    upstream api_backend {
        server 127.0.0.1:5000 weight=2 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5001 backup;
        keepalive 16;
        keepalive_timeout 1m;
    }
    server {
        server_name example.test www.example.test;
        listen 443 ssl default_server;
        listen [::]:443 ssl;
        try_files $uri $uri/ =404;
        ssl_certificate /tmp/nginx-sdk-tests/certs/fullchain.pem;
        ssl_certificate_key /tmp/nginx-sdk-tests/certs/privkey.pem;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        location /v2 {
            proxy_pass http://api_backend;
            limit_except GET POST {
                deny all;
            }
        }
        location /static/ {
            alias /var/www/static/;
        }
    }
}
