# Example site
# managed by the SDK tests

# main server
server {
    listen 8090;
    server_name comments.test; # the name

    # static files
    #location /old { root /srv/old; }
    location /static/ {
        root /var/www;
    }

    # about the API

    location /api {
        proxy_pass http://127.0.0.1:5000;
    }

    location = /health { return 204; } # probe
}
