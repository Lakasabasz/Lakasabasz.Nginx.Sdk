# main server
server {
    listen 8090;
    server_name comments.test; # the name

    # about the API

    location /api {
        proxy_pass http://127.0.0.1:5000;
    }

    location = /health { return 204; } # probe

    # a new location
    # with two lines
    location /new {
        root /var/www;
    }
}
