# Returned bodies show how nginx itself reads each argument
server {
	listen 8091;
	location = /plain { return 200 plain-value; }
	location = /double { return 200 "two words"; }
	location = /single { return 200 'single "inner"'; }
	location = /escapes { return 200 "q\" b\\ t\t u\d"; }
	location = /special { return 200 "a;b{c}d#e"; }
	location = /brace { return 200 a}b; }
}
