# Arguments in every form nginx reads
worker_processes  2;   # extra spaces and a comment after the directive
events {
	worker_connections 64;
}
http {
	log_format quoted '$remote_addr "$request" ${status}';
	server {
		listen 8090;
		server_name 'single quoted' "double quoted";
		set $suffix ${host}-x;
		add_header X-Chars "a b;{}#" always;
		add_header X-Escapes "q\" b\\ t\t u\d";
		location ~ \.(png|jpg)$ { return 204; }
		location = /braces { return 200 a}b; }
	}
}
